<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="dnshub — the private DNS control plane for your LAN, by Mostfa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c674"/>
      <stop offset="1" stop-color="#d4a72c"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="320" rx="26" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- faint grid -->
  <g stroke="#21262d" stroke-width="1" opacity="0.55">
    <line x1="0" y1="64" x2="1200" y2="64"/>
    <line x1="0" y1="128" x2="1200" y2="128"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="256" x2="1200" y2="256"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- shield: the ad-block / protection motif -->
  <path d="M96 88 L160 112 V176 C160 216 136 240 96 256 C56 240 32 216 32 176 V112 Z"
        fill="none" stroke="#58a6ff" stroke-width="5" stroke-linejoin="round"/>
  <path d="M64 168 L88 192 L132 142" fill="none" stroke="#3fb950" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="246" cy="60" r="5" fill="#f0c674"/>
  <circle cx="330" cy="40" r="3.5" fill="#58a6ff" opacity="0.7"/>
  <circle cx="420" cy="66" r="4" fill="#3fb950" opacity="0.6"/>

  <!-- wordmark -->
  <text x="238" y="180" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="86" font-weight="800" fill="url(#word)" letter-spacing="1">dnshub</text>
  <text x="560" y="180" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="86" font-weight="800" fill="url(#gold)">.</text>

  <!-- tagline -->
  <text x="242" y="222" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="21" fill="#8b949e" letter-spacing="0.5">the private DNS control plane for your LAN</text>
  <text x="242" y="252" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="15.5" fill="#6e7681" letter-spacing="1">
    ad-block · DoT/DoH · WireGuard · file hub · gaming fast lane</text>

  <!-- signature -->
  <text x="1150" y="274" text-anchor="end" font-family="Georgia,'Times New Roman',serif"
        font-size="34" font-style="italic" fill="url(#gold)">by Mostfa</text>
  <text x="1150" y="300" text-anchor="end" font-family="'Segoe UI',-apple-system,Arial,sans-serif"
        font-size="15" fill="#6e7681" letter-spacing="2">v2.0 · LAN-ONLY</text>
</svg>